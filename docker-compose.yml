services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vehicle_service
      POSTGRES_USER: vehicle_service
      POSTGRES_PASSWORD: vehicle_service
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehicle_service -d vehicle_service"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vehicle_service
      SPRING_DATASOURCE_USERNAME: vehicle_service
      SPRING_DATASOURCE_PASSWORD: vehicle_service
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
